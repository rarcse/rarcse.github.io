<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Germany UniHub — track and compare German MSc university applications.">
  <title>Germany UniHub</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 50% at 20% 15%, rgba(47, 158, 122, 0.18), transparent 55%),
        radial-gradient(ellipse 55% 40% at 90% 85%, rgba(31, 111, 139, 0.12), transparent 50%),
        #f3f7f4;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    html[data-theme="dark"] #app-loader {
      background:
        radial-gradient(ellipse 70% 50% at 20% 15%, rgba(47, 158, 122, 0.22), transparent 55%),
        radial-gradient(ellipse 55% 40% at 90% 85%, rgba(31, 111, 139, 0.16), transparent 50%),
        #0b1210;
    }
    #app-loader.is-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-loader-inner {
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
      max-width: 280px;
    }
    .app-loader-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(15, 40, 30, 0.16);
      animation: loader-float 2.2s ease-in-out infinite;
    }
    .app-loader-brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0f2a20;
      margin: 0;
    }
    html[data-theme="dark"] .app-loader-brand { color: #e8f2ed; }
    .app-loader-sub {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #5f746a;
    }
    html[data-theme="dark"] .app-loader-sub { color: #8aa399; }
    .app-loader-ring {
      width: 36px;
      height: 36px;
      margin-top: 6px;
      border-radius: 50%;
      border: 3px solid rgba(47, 158, 122, 0.2);
      border-top-color: #2f9e7a;
      animation: loader-spin 0.8s linear infinite;
    }
    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes loader-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-logo,
      .app-loader-ring { animation: none; }
    }
  </style>
  <script>
    try {
      if (localStorage.getItem('germany-unihub-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="app-loader" role="status" aria-live="polite" aria-label="Loading Germany UniHub">
    <div class="app-loader-inner">
      <img class="app-loader-logo" src="logo.png" alt="" width="72" height="72" />
      <p class="app-loader-brand">Germany UniHub</p>
      <p class="app-loader-sub">Loading programs…</p>
      <div class="app-loader-ring" aria-hidden="true"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dist/data.js"></script>
  <script src="dist/app.js"></script>
</body>

</html>
